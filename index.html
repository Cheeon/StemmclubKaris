<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KaRis</title>

<script>
/* ============================================================
   KONFIGURATION
   ============================================================ */
const CONFIG = {
  // Aus Supabase → Project Settings → API
  SUPABASE_URL:      "",   // z.B. "https://abcdefgh.supabase.co"
  SUPABASE_ANON_KEY: "",   // "publishable"-Key (sb_publishable_…) oder "anon public" (eyJ…)

  TITEL: "KaRis",
  UNTERTITEL: "Wer ist wann da?",

  BUTTON_TEXT: "KaRis",    // Beschriftung des Anmelde-Buttons

  ANZEIGE_VON_STUNDE: 7,   // erste angezeigte Stunde im Raster
  ANZEIGE_BIS_STUNDE: 22,  // letzte angezeigte Stunde (exklusiv)

  SPERRFRIST_STUNDEN: 24,  // so lange vorher ist eine Änderung noch möglich
  ABMELDEN_NACH_MINUTEN: 30, // automatische Abmeldung bei Inaktivität
};
</script>

<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f0f2f5;
  --text:#16181d; --muted:#6b7280; --line:#e2e5ea;
  --accent:#2f6df6; --accent-soft:#dbe6ff;
  --own:#2f6df6; --own-soft:#c9dbff;
  --heat:47,109,246; --ok:#1a7f4b; --ok-bg:#e4f5eb; --warn:#8a5a00; --warn-bg:#fdf2dc;
  --lock:#c9ccd2;
  --shadow:0 1px 2px rgba(16,24,40,.06), 0 4px 14px rgba(16,24,40,.05);
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1116; --surface:#161a21; --surface-2:#1d222b;
    --text:#e8eaef; --muted:#9aa3b2; --line:#2a303b;
    --accent:#5b8cff; --accent-soft:#1e2b47;
    --own:#5b8cff; --own-soft:#233254;
    --heat:91,140,255; --ok:#5ed69b; --ok-bg:#12291f; --warn:#e3b25f; --warn-bg:#2b2213;
    --lock:#39414f;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1116; --surface:#161a21; --surface-2:#1d222b;
  --text:#e8eaef; --muted:#9aa3b2; --line:#2a303b;
  --accent:#5b8cff; --accent-soft:#1e2b47;
  --own:#5b8cff; --own-soft:#233254;
  --heat:91,140,255; --ok:#5ed69b; --ok-bg:#12291f; --warn:#e3b25f; --warn-bg:#2b2213;
  --lock:#39414f;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
[hidden]{display:none !important}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px; margin:0 auto; padding:26px 20px 64px}

header.top{display:flex; flex-wrap:wrap; gap:16px; align-items:center; justify-content:space-between; margin-bottom:22px}
h1{font-size:23px; line-height:1.2; margin:0 0 2px; letter-spacing:-.015em}
.sub{color:var(--muted); font-size:13.5px}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
.pad{padding:16px 18px}
h2{font-size:15px; margin:0 0 12px; letter-spacing:-.005em}

button{
  font:inherit; font-weight:500; color:var(--text); background:var(--surface);
  border:1px solid var(--line); border-radius:9px; padding:7px 13px; cursor:pointer;
  transition:background .12s, border-color .12s, filter .12s;
}
button:hover{background:var(--surface-2)}
button.primary{background:var(--accent); border-color:var(--accent); color:#fff}
button.primary:hover{filter:brightness(1.07); background:var(--accent)}
button.big{padding:10px 20px; font-size:15px; font-weight:600; border-radius:10px}
button:disabled{opacity:.5; cursor:not-allowed}
input, select{
  font:inherit; color:var(--text); background:var(--surface);
  border:1px solid var(--line); border-radius:9px; padding:7px 10px; min-width:0;
}
input:focus, select:focus{outline:2px solid var(--accent-soft); border-color:var(--accent)}
label.f{display:flex; flex-direction:column; gap:5px; font-size:12.5px; color:var(--muted); font-weight:500}

.banner{
  display:flex; gap:10px; align-items:flex-start;
  background:var(--warn-bg); color:var(--warn); border-radius:10px;
  padding:10px 13px; font-size:13.5px; margin-bottom:18px;
}
.hint{font-size:12.5px; color:var(--muted)}
.notice{
  display:flex; gap:10px; align-items:center; justify-content:space-between;
  background:var(--accent-soft); color:var(--text); border-radius:10px;
  padding:10px 13px; font-size:13.5px; margin-bottom:18px;
}
.notice button{padding:4px 10px; font-size:13px}
.headright{display:flex; align-items:center; gap:10px}

/* PIN-Feld mit Anzeigen-Knopf */
.pinrow{display:flex; gap:6px}
.pinrow input{flex:1}
.pinrow button{
  padding:7px 11px; font-size:13px; white-space:nowrap;
  touch-action:none; user-select:none; -webkit-user-select:none;
}
.pinrow button.on{background:var(--accent-soft); border-color:var(--accent)}
.err{color:#c0392b; font-size:13px}
@media (prefers-color-scheme:dark){ .err{color:#ff8f80} }

/* ---- Suche ---- */
.query{display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end}
.result{margin-top:16px}
.res-empty{font-size:14px; color:var(--muted)}
.res-when{font-size:13px; color:var(--muted); margin-bottom:10px}
table.res{width:100%; border-collapse:collapse; font-size:14px}
table.res td{padding:8px 10px; border-top:1px solid var(--line); vertical-align:top}
table.res tr:first-child td{border-top:none}
table.res td.nm{font-weight:600; width:1%; white-space:nowrap}
table.res td.tm{white-space:nowrap; width:1%; font-variant-numeric:tabular-nums}
table.res td.ex{color:var(--muted); font-size:13px}
.badge{
  display:inline-block; font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:999px;
  background:var(--ok-bg); color:var(--ok); letter-spacing:.01em;
}

/* ---- Wochen-Navigation ---- */
.nav{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px}
.nav .range{font-weight:600; font-size:15px; min-width:200px}
.spacer{flex:1}
.legend{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted)}
.legend .sw{width:14px; height:14px; border-radius:3px; border:1px solid var(--line)}

/* ---- Raster ---- */
.gridwrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
.grid{
  display:grid; grid-template-columns:58px repeat(7, minmax(84px,1fr));
  min-width:680px; user-select:none; -webkit-user-select:none;
}
.grid .hd{
  position:sticky; top:0; z-index:2; background:var(--surface);
  border-bottom:1px solid var(--line); padding:8px 4px; text-align:center;
}
.grid .hd .dow{font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.grid .hd .dt{font-size:15px; font-weight:600}
.grid .hd.today .dt{color:var(--accent)}
.grid .corner{position:sticky; top:0; z-index:3; background:var(--surface); border-bottom:1px solid var(--line)}
.tl{
  font-size:11px; color:var(--muted); text-align:right; padding-right:8px;
  border-right:1px solid var(--line); position:relative; height:16px;
}
.tl span{position:relative; top:-7px; background:var(--surface); padding:0 2px}
.tl.first span{top:0}
.cell{
  height:16px; border-right:1px solid var(--line);
  background:var(--surface-2); position:relative;
}
.cell.h0{border-top:1px solid var(--line)}
.cell.h30{border-top:1px dotted var(--line)}
.cell .bar{position:absolute; inset:0; background:rgba(var(--heat), var(--a,0)); pointer-events:none}
.cell.own::after{content:""; position:absolute; inset:0; background:var(--own); opacity:.85}
#gridEdit .cell{cursor:crosshair}
#gridEdit .cell.locked{
  cursor:not-allowed;
  background:repeating-linear-gradient(45deg, var(--surface-2) 0 4px, var(--lock) 4px 6px);
}
#gridEdit .cell.locked.own::after{opacity:.4}

/* ---- Modal ---- */
.modal{
  position:fixed; inset:0; background:rgba(10,13,18,.55); backdrop-filter:blur(2px);
  display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;
}
.modalbox{width:100%; max-width:340px; padding:20px}
.modalbox h2{margin-bottom:16px}
.modalbox .f{margin-bottom:12px}
.modalbox .f input, .modalbox .f select{width:100%}
.modalrow{display:flex; gap:8px; margin-top:16px}
.modalrow button{flex:1}

.editbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px}
.editbar .name{font-weight:600}
.savestate{font-size:13px; color:var(--muted)}
.savestate.dirty{color:var(--warn); font-weight:500}
.savestate.done{color:var(--ok); font-weight:500}
footer{margin-top:28px; color:var(--muted); font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1 id="titel">KaRis</h1>
      <div class="sub" id="untertitel">Wer ist wann da?</div>
    </div>
    <div class="headright">
      <button id="headLogout" hidden>Abmelden</button>
      <button class="primary big" id="karisBtn">KaRis</button>
    </div>
  </header>

  <div class="notice" id="notice" hidden>
    <span id="noticeText"></span>
    <button id="noticeClose">OK</button>
  </div>

  <div id="demoBanner" class="banner" hidden>
    <span>⚠️</span>
    <div><b>Demo-Modus.</b> Es ist keine Datenbank hinterlegt – Eintragungen bleiben nur in diesem Browser.
    Trage <code>SUPABASE_URL</code> und <code>SUPABASE_ANON_KEY</code> oben im Code ein, damit alle dieselben Daten sehen.

  <!-- ============ ÖFFENTLICHE ANSICHT ============ -->

  </div>

  <!-- ============ EIGENE VERFÜGBARKEIT ============ -->
  <div id="viewEdit" hidden>

    <div class="card pad">
      <div class="editbar">

        <span class="name" id="editWho"></span>

      <div class="nav">
        <button id="ePrevWeek" title="Vorige Woche">←</button>

      <div class="hint" style="margin-top:12px" id="lockHint"></div>

  </div>

  <footer id="foot"></footer>
</div>

<!-- ============ ANMELDUNG ============ -->

  <div class="modalbox card">
    <h2>Anmelden</h2>
    <label class="f">Name
      <select id="loginName"><option value="">– wählen –</option></select></label>

<script>
"use strict";

/* ============================================================
   Grundlagen
   ============================================================ */
const SLOTS_PER_DAY = 96;
const EMPTY_MASK = "0".repeat(SLOTS_PER_DAY);
const DOW = ["Mo","Di","Mi","Do","Fr","Sa","So"];

const $ = (s) => document.querySelector(s);
const pad2 = (n) => String(n).padStart(2, "0");
const iso = (d) => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const parseISO = (s) => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const mondayOf = (d) => addDays(d, -(( d.getDay() + 6) % 7));
const slotLabel = (i) => `${pad2(Math.floor(i/4))}:${pad2((i%4)*15)}`;
const timeToSlot = (t) => { const [h,m] = t.split(":").map(Number); return h*4 + Math.floor(m/15); };
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Wie viele Slots eines Tages sind gesperrt (beginnen in weniger als X Stunden)? */
function lockedCount(dayISO){
  const cutoff = Date.now() + CONFIG.SPERRFRIST_STUNDEN * 3600 * 1000;
  const dayStart = parseISO(dayISO).getTime();
  const n = Math.ceil((cutoff - dayStart) / (15 * 60 * 1000));
  return Math.max(0, Math.min(SLOTS_PER_DAY, n));
}

/* ============================================================
   Speicher-Schicht
   ============================================================ */
const useSupabase = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);

const SupabaseStore = {
  head(extra){
    const k = CONFIG.SUPABASE_ANON_KEY;
    const h = { "apikey": k };
    if(k.startsWith("eyJ")) h["Authorization"] = "Bearer " + k;
    return Object.assign(h, extra || {});
  },
  async rpc(fn, body){
    const r = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/rpc/${fn}`, {
      method:"POST",
      headers: this.head({ "Content-Type": "application/json" }),
      body: JSON.stringify(body || {})
    });
    if(!r.ok) throw new Error(await r.text());
    const txt = await r.text();
    return txt ? JSON.parse(txt) : null;
  },
  async listPeople(){ return await this.rpc("list_people"); },
  async login(name, pin){ return await this.rpc("login", { p_name:name, p_pin:pin }); },
  async whoami(token){ const r = await this.rpc("whoami", { p_token:token }); return (r && r[0]) || null; },
  async loadRange(fromISO, toISO){
    const url = `${CONFIG.SUPABASE_URL}/rest/v1/availability`
      + `?select=person_id,day,mask&day=gte.${fromISO}&day=lte.${toISO}`;
    const r = await fetch(url, { headers: this.head() });
    if(!r.ok) throw new Error(await r.text());
    return await r.json();
  },
  async saveDay(token, dayISO, mask){
    return await this.rpc("save_day", { p_token:token, p_day:dayISO, p_mask:mask });
  }
};

/* Demo-Speicher: nur dieser Browser. */
const LocalStore = (() => {
  const KEY = "karis-demo-v1";
  let mem = null;
  function read(){
    if(mem) return mem;
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch(e){}
    mem = raw ? JSON.parse(raw) : {
      people: [{id:"p1", name:"Leon", pin:"1234"}, {id:"p2", name:"Nancy", pin:"1234"}],
      avail: {}
    };
    return mem;
  }
  function write(){ try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch(e){} }
  return {
    async listPeople(){ return read().people.map(p => ({id:p.id, name:p.name})); },
    async login(name, pin){
      const p = read().people.find(x => x.name.toLowerCase() === String(name).trim().toLowerCase());
      return (p && p.pin === pin) ? ("demo:" + p.id) : null;
    },
    async whoami(token){
      const id = String(token || "").replace(/^demo:/, "");
      const p = read().people.find(x => x.id === id);
      return p ? {id:p.id, name:p.name} : null;
    },
    async loadRange(fromISO, toISO){
      const out = [];
      for(const k in read().avail){
        const [pid, day] = k.split("|");
        if(day >= fromISO && day <= toISO) out.push({person_id:pid, day, mask:mem.avail[k]});
      }
      return out;
    },
    async saveDay(token, dayISO, mask){
      const id = String(token || "").replace(/^demo:/, "");
      read();
      // Sperrfrist auch im Demo-Modus nachbilden
      const lock = lockedCount(dayISO);
      const old = mem.avail[id + "|" + dayISO] || EMPTY_MASK;
      mem.avail[id + "|" + dayISO] = old.slice(0, lock) + mask.slice(lock);
      write();
    }
  };
})();

const Store = useSupabase ? SupabaseStore : LocalStore;

/* ============================================================
   Zustand
   ============================================================ */
const state = {
  people: [],
  avail: new Map(),            // "personId|dayISO" -> mask (Stand der Datenbank)
  draft: new Map(),            // eigene, noch nicht gespeicherte Änderungen
  monday: mondayOf(new Date()),
  me: null,
  token: null,
  view: "public",
  lastAct: Date.now(),
};

const TOKEN_KEY = "karis-token";
function saveToken(t){ try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch(e){} }
function readToken(){ try { return localStorage.getItem(TOKEN_KEY); } catch(e){ return null; } }

/* ---- Inaktivität ---- */
const IDLE_MS = Math.max(1, CONFIG.ABMELDEN_NACH_MINUTEN) * 60 * 1000;
const ACT_KEY = "karis-last-activity";
function touchActivity(){
  state.lastAct = Date.now();
  try { localStorage.setItem(ACT_KEY, String(state.lastAct)); } catch(e){}
}
function readActivity(){
  try { return Number(localStorage.getItem(ACT_KEY)) || 0; } catch(e){ return 0; }
}
function showNotice(text){
  $("#noticeText").textContent = text;
  $("#notice").hidden = false;
}

/* Jede Eingabe zählt als Aktivität. */
["pointerdown","keydown","wheel","touchstart"].forEach(ev =>
  window.addEventListener(ev, () => { if(state.me) touchActivity(); }, {passive:true}));

async function autoLogout(){
  const hatteAenderungen = state.draft.size > 0;
  if(hatteAenderungen){
    try { await saveAll(); } catch(e){ console.error(e); }
  }
  state.draft.clear();
  state.me = null; state.token = null; saveToken(null);
  showView("public");
  showNotice(hatteAenderungen
    ? `Nach ${CONFIG.ABMELDEN_NACH_MINUTEN} Minuten ohne Aktivität automatisch abgemeldet. Deine Änderungen wurden vorher gespeichert.`
    : `Nach ${CONFIG.ABMELDEN_NACH_MINUTEN} Minuten ohne Aktivität automatisch abgemeldet.`);
}

function logout(){
  if(state.draft.size && !confirm("Es gibt ungespeicherte Änderungen. Trotzdem abmelden?")) return;
  state.draft.clear();
  state.me = null; state.token = null; saveToken(null);
  showView("public");
}

const key = (pid, day) => pid + "|" + day;
const maskOf = (pid, day) => state.avail.get(key(pid, day)) || EMPTY_MASK;
/* eigene Ansicht inklusive ungespeicherter Änderungen */
const myMask = (day) => state.draft.get(day) || (state.me ? maskOf(state.me.id, day) : EMPTY_MASK);

/* ============================================================
   Raster
   ============================================================ */
const S0 = Math.max(0, Math.min(23, CONFIG.ANZEIGE_VON_STUNDE)) * 4;
const S1 = Math.max(1, Math.min(24, CONFIG.ANZEIGE_BIS_STUNDE)) * 4;

function weekDays(){ return [...Array(7)].map((_, i) => addDays(state.monday, i)); }

function buildGrid(el){
  const days = weekDays();
  const todayISO = iso(new Date());
  let html = '<div class="corner"></div>';
  for(const d of days){
    html += `<div class="hd${iso(d) === todayISO ? " today" : ""}">
      <div class="dow">${DOW[(d.getDay()+6)%7]}</div>
      <div class="dt">${d.getDate()}.${d.getMonth()+1}.</div></div>`;
  }
  for(let s = S0; s < S1; s++){
    html += `<div class="tl${s === S0 ? " first" : ""}">${s % 4 === 0 ? `<span>${slotLabel(s)}</span>` : ""}</div>`;
    for(let c = 0; c < 7; c++){
      const cls = s % 4 === 0 ? " h0" : (s % 4 === 2 ? " h30" : "");
      html += `<div class="cell${cls}" data-c="${c}" data-s="${s}"><i class="bar"></i></div>`;
    }
  }
  el.innerHTML = html;
  const label = `${days[0].getDate()}.${days[0].getMonth()+1}. – ${days[6].getDate()}.${days[6].getMonth()+1}.${days[6].getFullYear()}`;
  $("#range").textContent = label;
  $("#eRange").textContent = label;
}

function paintPublic(){
  const days = weekDays().map(iso);
  const total = Math.max(1, state.people.length);
  for(const cell of $("#gridPublic").querySelectorAll(".cell")){
    const s = +cell.dataset.s, day = days[+cell.dataset.c];
    let count = 0; const names = [];
    for(const p of state.people){
      if(maskOf(p.id, day)[s] === "1"){ count++; names.push(p.name); }
    }
    cell.style.setProperty("--a", count ? (0.18 + 0.67 * (count/total)).toFixed(3) : 0);
    cell.title = `${slotLabel(s)}–${slotLabel(s+1)} · ` + (count ? names.join(", ") : "niemand");
  }
}

function paintEdit(){
  const days = weekDays().map(iso);
  for(const cell of $("#gridEdit").querySelectorAll(".cell")){
    const s = +cell.dataset.s, day = days[+cell.dataset.c];
    const locked = s < lockedCount(day);
    cell.classList.toggle("locked", locked);
    cell.classList.toggle("own", myMask(day)[s] === "1");
    cell.title = locked
      ? `${slotLabel(s)} · Änderung nicht mehr möglich`
      : `${slotLabel(s)}–${slotLabel(s+1)}`;
  }
}

/* ---- Malen per Ziehen (nur in der Bearbeiten-Ansicht) ---- */
let dragging = false, dragOn = true;
const gridEdit = $("#gridEdit");

gridEdit.addEventListener("pointerdown", (e) => {
  const cell = e.target.closest(".cell");
  if(!cell || !state.me || cell.classList.contains("locked")) return;
  e.preventDefault();
  const day = iso(addDays(state.monday, +cell.dataset.c));
  dragging = true;
  dragOn = myMask(day)[+cell.dataset.s] !== "1";
  applyCell(cell);
  gridEdit.setPointerCapture(e.pointerId);
});
gridEdit.addEventListener("pointermove", (e) => {
  if(!dragging) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const cell = el && el.closest && el.closest(".cell");
  if(cell && gridEdit.contains(cell)) applyCell(cell);
});
window.addEventListener("pointerup", () => { dragging = false; });

function applyCell(cell){
  if(cell.classList.contains("locked")) return;
  const day = iso(addDays(state.monday, +cell.dataset.c));
  const s = +cell.dataset.s;
  const m = myMask(day);
  if((m[s] === "1") === dragOn) return;
  state.draft.set(day, m.slice(0, s) + (dragOn ? "1" : "0") + m.slice(s+1));
  paintEdit();
  markDirty();
}

function markDirty(){
  const el = $("#saveState");
  el.className = "savestate dirty";
  el.textContent = "ungespeicherte Änderungen";
}
function markSaved(){
  const el = $("#saveState");
  el.className = "savestate done";
  el.textContent = "gespeichert ✓";
  setTimeout(() => { if(!state.draft.size){ el.textContent = ""; el.className = "savestate"; } }, 2500);
}

async function saveAll(){
  if(!state.draft.size){ markSaved(); return; }
  const btn = $("#saveBtn");
  btn.disabled = true;
  $("#saveState").className = "savestate";
  $("#saveState").textContent = "speichere …";
  try{
    for(const [day, mask] of [...state.draft]){
      await Store.saveDay(state.token, day, mask);
      state.avail.set(key(state.me.id, day), mask);
      state.draft.delete(day);
    }
    markSaved();
    await loadWeek();
    paintEdit();
  }catch(err){
    $("#saveState").className = "savestate dirty";
    $("#saveState").textContent = "Fehler beim Speichern";
    console.error(err);
  }finally{ btn.disabled = false; }
}

window.addEventListener("beforeunload", (e) => {
  if(state.draft.size){ e.preventDefault(); e.returnValue = ""; }
});

/* ============================================================
   Daten laden
   ============================================================ */
async function loadWeek(){
  const from = iso(state.monday), to = iso(addDays(state.monday, 6));
  try{
    const rows = await Store.loadRange(from, to);
    for(let i = 0; i < 7; i++){
      const d = iso(addDays(state.monday, i));
      for(const p of state.people) state.avail.delete(key(p.id, d));
    }
    for(const r of rows) state.avail.set(key(r.person_id, r.day), r.mask);
  }catch(err){ console.error(err); }
  paintPublic();
  if(state.view === "edit") paintEdit();
}

async function loadPeople(){
  try{ state.people = await Store.listPeople() || []; }
  catch(err){ state.people = []; console.error(err); }
  $("#peopleLine").textContent = state.people.length
    ? "Gruppe: " + state.people.map(p => p.name).join(", ")
    : "Noch keine Personen angelegt.";
  const sel = $("#loginName");
  sel.innerHTML = `<option value="">– wählen –</option>`
    + state.people.map(p => `<option>${esc(p.name)}</option>`).join("");
}

/* ============================================================
   Ansichten
   ============================================================ */
function showView(v){
  state.view = v;
  $("#viewPublic").hidden = (v !== "public");
  $("#viewEdit").hidden   = (v !== "edit");
  $("#karisBtn").textContent = (v === "edit") ? "Übersicht" : CONFIG.BUTTON_TEXT;
  $("#headLogout").hidden = !(state.me && v === "public");
  if(v === "edit"){
    $("#editWho").textContent = state.me ? "Verfügbarkeit von " + state.me.name : "";
    buildGrid(gridEdit); paintEdit();
  } else {
    buildGrid($("#gridPublic")); paintPublic();
  }
  window.scrollTo({top:0, behavior:"smooth"});
}

function openLogin(){
  $("#loginErr").textContent = "";
  $("#loginPin").value = "";
  $("#loginPin").type = "password";
  $("#pinPeek").classList.remove("on");
  $("#loginModal").hidden = false;
  setTimeout(() => $("#loginName").focus(), 30);
}
function closeLogin(){ $("#loginModal").hidden = true; }

async function doLogin(){
  const name = $("#loginName").value, pin = $("#loginPin").value;
  const err = $("#loginErr");
  err.textContent = "";
  if(!name || !pin){ err.textContent = "Name und PIN angeben."; return; }
  try{
    const token = await Store.login(name, pin);
    if(!token){ err.textContent = "Name oder PIN stimmt nicht."; return; }
    state.token = token;
    state.me = await Store.whoami(token);
    saveToken(token);
    touchActivity();
    closeLogin();
    showView("edit");
  }catch(e){ err.textContent = "Anmeldung fehlgeschlagen."; console.error(e); }
}

/* ============================================================
   Zeitraum prüfen
   ============================================================ */
function runQuery(){
  const day = $("#qDate").value;
  const from = $("#qFrom").value, to = $("#qTo").value;
  const box = $("#qResult");
  if(!day || !from || !to){ box.innerHTML = `<div class="res-empty">Bitte Datum und Zeitraum angeben.</div>`; return; }
  const a = timeToSlot(from), b = timeToSlot(to);
  if(b <= a){ box.innerHTML = `<div class="res-empty">Die Endzeit muss nach der Startzeit liegen.</div>`; return; }

  const rows = [];
  for(const p of state.people){
    const m = maskOf(p.id, day);
    const blocks = [];
    let start = null;
    for(let s = a; s <= b; s++){
      const on = s < b && m[s] === "1";
      if(on && start === null) start = s;
      if(!on && start !== null){
        // über den Suchzeitraum hinaus schauen
        let x = start, y = s;
        while(x > 0 && m[x-1] === "1") x--;
        while(y < SLOTS_PER_DAY && m[y] === "1") y++;
        blocks.push({ from:start, to:s, fullFrom:x, fullTo:y });
        start = null;
      }
    }
    if(blocks.length){
      const covered = blocks.reduce((n, bl) => n + (bl.to - bl.from), 0);
      rows.push({ name:p.name, blocks, full: covered === (b - a) });
    }
  }
  rows.sort((x, y) => (y.full - x.full) || x.name.localeCompare(y.name, "de"));

  const when = `${parseISO(day).toLocaleDateString("de-DE", {weekday:"long", day:"numeric", month:"long", year:"numeric"})}, ${from}–${to}`;
  if(!rows.length){
    box.innerHTML = `<div class="res-when">${esc(when)}</div>
      <div class="res-empty">In diesem Zeitraum ist niemand verfügbar.</div>`;
  } else {
    box.innerHTML = `<div class="res-when">${esc(when)}</div><table class="res">`
      + rows.map(r => {
          const times = r.blocks.map(bl => `${slotLabel(bl.from)}–${slotLabel(bl.to)}`).join(", ");
          let extra = "";
          if(r.full) extra = `<span class="badge">ganzer Zeitraum</span>`;
          else {
            const bl = r.blocks[0];
            const parts = [];
            if(bl.fullFrom < bl.from) parts.push("ab " + slotLabel(bl.fullFrom));
            if(bl.fullTo > bl.to) parts.push("bis " + slotLabel(bl.fullTo));
            if(parts.length) extra = "durchgehend verfügbar " + parts.join(" ");
          }
          return `<tr><td class="nm">${esc(r.name)}</td><td class="tm">${times}</td><td class="ex">${extra}</td></tr>`;
        }).join("")
      + `</table>`;
  }

  // Kalender auf die passende Woche stellen
  const m = mondayOf(parseISO(day));
  if(iso(m) !== iso(state.monday)){ state.monday = m; buildGrid($("#gridPublic")); loadWeek(); }
}

/* ============================================================
   Start
   ============================================================ */
async function init(){
  $("#titel").textContent = CONFIG.TITEL;
  $("#untertitel").textContent = CONFIG.UNTERTITEL;
  $("#karisBtn").textContent = CONFIG.BUTTON_TEXT;
  document.title = CONFIG.TITEL;
  if(!useSupabase) $("#demoBanner").hidden = false;
  $("#qDate").value = iso(new Date());
  $("#lockHint").textContent =
    `Ziehen markiert, nochmal ziehen löscht. Änderungen sind bis ${CONFIG.SPERRFRIST_STUNDEN} Stunden`
    + ` vor dem jeweiligen Zeitpunkt möglich – schraffierte Felder sind gesperrt.`
    + ` Nach ${CONFIG.ABMELDEN_NACH_MINUTEN} Minuten ohne Aktivität wirst du automatisch abgemeldet.`;
  $("#foot").textContent =
    "Eintragen nur mit Name und PIN. Alle mit dem Link sehen den Kalender, können aber nichts ändern.";

  buildGrid($("#gridPublic"));
  await loadPeople();

  const t = readToken();
  if(t && Date.now() - readActivity() < IDLE_MS){
    try{
      const me = await Store.whoami(t);
      if(me){ state.token = t; state.me = me; touchActivity(); }
    }catch(e){}
  } else if(t){
    saveToken(null);   // zu lange her – Anmeldung verfällt
  }

  await loadWeek();
  runQuery();

  // Öffentliche Ansicht
  $("#qGo").onclick = runQuery;
  $("#prevWeek").onclick = () => { state.monday = addDays(state.monday, -7); buildGrid($("#gridPublic")); loadWeek(); };
  $("#nextWeek").onclick = () => { state.monday = addDays(state.monday,  7); buildGrid($("#gridPublic")); loadWeek(); };
  $("#today").onclick    = () => { state.monday = mondayOf(new Date());      buildGrid($("#gridPublic")); loadWeek(); };

  // KaRis-Button
  $("#karisBtn").onclick = () => {
    if(state.view === "edit"){ leaveEdit(); return; }
    if(state.me) showView("edit"); else openLogin();
  };

  // Anmeldung
  $("#loginGo").onclick = doLogin;
  $("#loginCancel").onclick = closeLogin;
  $("#loginPin").addEventListener("keydown", e => { if(e.key === "Enter") doLogin(); });
  $("#loginModal").addEventListener("click", e => { if(e.target.id === "loginModal") closeLogin(); });

  // Bearbeiten-Ansicht
  $("#saveBtn").onclick = saveAll;
  $("#backBtn").onclick = leaveEdit;
  $("#logoutBtn").onclick = logout;
  $("#headLogout").onclick = logout;
  $("#noticeClose").onclick = () => { $("#notice").hidden = true; };
  $("#clearWeek").onclick = () => {
    for(const d of weekDays().map(iso)){
      const lock = lockedCount(d);
      const m = myMask(d);
      state.draft.set(d, m.slice(0, lock) + EMPTY_MASK.slice(lock));
    }
    paintEdit(); markDirty();
  };
  $("#ePrevWeek").onclick = () => { state.monday = addDays(state.monday, -7); buildGrid(gridEdit); loadWeek().then(paintEdit); };
  $("#eNextWeek").onclick = () => { state.monday = addDays(state.monday,  7); buildGrid(gridEdit); loadWeek().then(paintEdit); };
  $("#eToday").onclick    = () => { state.monday = mondayOf(new Date());      buildGrid(gridEdit); loadWeek().then(paintEdit); };

  // PIN sichtbar machen, solange der Knopf gedrückt gehalten wird
  const peek = $("#pinPeek"), pinField = $("#loginPin");
  const pinShow = () => { pinField.type = "text";     peek.classList.add("on"); };
  const pinHide = () => { pinField.type = "password"; peek.classList.remove("on"); };
  peek.addEventListener("pointerdown", e => { e.preventDefault(); pinShow(); });
  ["pointerup","pointercancel","pointerleave","blur"].forEach(ev => peek.addEventListener(ev, pinHide));
  window.addEventListener("pointerup", pinHide);
  peek.addEventListener("keydown", e => { if(e.key === " " || e.key === "Enter"){ e.preventDefault(); pinShow(); } });
  peek.addEventListener("keyup",   e => { if(e.key === " " || e.key === "Enter"){ pinHide(); } });

  setInterval(() => {
    if(!dragging && !state.draft.size) loadWeek();
  }, 25000);

  // Wache über die Inaktivität
  setInterval(() => {
    if(state.me && Date.now() - state.lastAct > IDLE_MS) autoLogout();
  }, 20000);
}

function leaveEdit(){
  if(state.draft.size && !confirm("Es gibt ungespeicherte Änderungen. Ansicht trotzdem verlassen?")) return;
  state.draft.clear();
  showView("public");
}

init();
</script>
</body>
</html>
